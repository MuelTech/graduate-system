name: CI

# Development-phase continuous integration: validate frontend and backend on
# pull requests targeting `main` and on pushes to `main`.
#
# Scope: build/test validation only. No deployment, no database service, no
# Prisma migration, and no production secrets are configured here.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Test-only placeholder connection string. Some backend test imports load
      # src/config/database.ts, which requires DATABASE_URL to be defined.
      # No database service is provisioned for this CI phase, and tests do not
      # depend on a live database. Any connection failure is handled by the
      # existing database initialization code.
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci_placeholder
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
